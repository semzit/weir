name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --group dev --extra cpu
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync vulture
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n cloud/*.sh cloud/weir
      - run: shellcheck cloud/*.sh cloud/weir

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.2"
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra/bootstrap init -backend=false
      - run: tofu -chdir=infra/bootstrap validate
      - run: tofu -chdir=infra init -backend=false
      - run: tofu -chdir=infra validate

  docker-smoke:
    needs: [quality, shell]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: weir:smoke
          build-args: |
            TORCH_EXTRA=cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm weir:smoke agent=cartpole task=balance train.total_steps=64 algo.n_steps=64

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, shell, docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TORCH_EXTRA=gpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
