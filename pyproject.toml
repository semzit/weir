[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weir"
version = "0.1.0"
description = "Train a simulated legged robot to walk using reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3.0",
    "hydra-core>=1.3.2",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "mujoco>=3.11.0",
    "omegaconf>=2.3,<3.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "pydantic>=2.0",
    "scipy>=1.17.1",
    "stable-baselines3>=2.9.0",
]

# torch is chosen per-extra so each index maps to one build. Every command
# must pick an extra: `--extra cpu` (default machines) or `--extra gpu`
# (NVIDIA machines). Run without an extra and sb3's transitive torch would
# resolve from PyPI (a CUDA build on Linux).
#   uv sync --group dev --extra cpu
#   uv sync --group dev --extra gpu
[project.optional-dependencies]
cpu = ["torch>=2.13.0"]
gpu = ["torch>=2.13.0"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[project.scripts]
weir-eval = "weir.cli.eval:main"
weir-export = "weir.cli.export:main"
weir-render = "weir.cli.render:main"
weir-train = "weir.cli.train:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "vulture>=2.15",
]

# The CPU index comes first: default resolution (torch>=2.13.0) lands on the
# CPU build. The gpu extra pins torch==2.13.0+cu130, a build that only exists
# on the cu130 index, so `uv sync --extra gpu` switches to CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["weir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=weir --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["weir"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["weir/.vulture_whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.vulture]
paths = ["weir", "tests"]
min_confidence = 60

[tool.pyright]
include = ["weir", "tests"]
exclude = ["weir/.vulture_whitelist.py"]
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingTypeStubs = false
reportMissingModuleSource = "none"
reportAttributeAccessIssue = "none"
